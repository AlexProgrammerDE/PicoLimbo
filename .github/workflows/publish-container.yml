name: Publish fork container

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-fork-container
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'AlexProgrammerDE/PicoLimbo' && github.ref == 'refs/heads/master'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
          - arch: arm64
            target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Install musl tools and target
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          rustup target add ${{ matrix.target }}
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ghcr-${{ matrix.target }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
      - name: Build release executable
        run: |
          cargo build --release --locked --target ${{ matrix.target }} --bin pico_limbo
          cp target/${{ matrix.target }}/release/pico_limbo docker/pico_limbo
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and smoke test image
        run: |
          docker build -f docker/Dockerfile.ci -t picolimbo:test docker
          docker run --rm picolimbo:test pico_limbo --version
      - name: Publish architecture image
        uses: docker/build-push-action@v7
        with:
          context: docker
          file: docker/Dockerfile.ci
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ghcr.io/alexprogrammerde/picolimbo:sha-${{ github.sha }}-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=https://github.com/AlexProgrammerDE/PicoLimbo
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish multi-platform tags
        env:
          IMAGE: ghcr.io/alexprogrammerde/picolimbo
          REVISION: ${{ github.sha }}
        run: |
          docker buildx imagetools create \
            -t "$IMAGE:latest" \
            -t "$IMAGE:sha-$REVISION" \
            "$IMAGE:sha-$REVISION-amd64" \
            "$IMAGE:sha-$REVISION-arm64"
          docker buildx imagetools inspect "$IMAGE:sha-$REVISION"
